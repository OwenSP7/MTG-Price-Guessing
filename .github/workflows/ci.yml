name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MtgPriceGuesser.sln

      - name: Build
        run: dotnet build MtgPriceGuesser.sln -c Release --no-restore

  unit-tests:
    name: xUnit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MtgPriceGuesser.sln

      - name: Build
        run: dotnet build MtgPriceGuesser.sln -c Release --no-restore

      - name: Test frontend
        run: dotnet test MtgPriceGuesser.Client.Tests/MtgPriceGuesser.Client.Tests.csproj -c Release --no-build --verbosity normal

      - name: Test backend
        run: dotnet test MtgPriceGuesser.Api.Tests/MtgPriceGuesser.Api.Tests.csproj -c Release --no-build --verbosity normal

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd ~/MTG-Price-Guessing
            git pull origin main
            docker compose down
            docker compose up --build -d